<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dining Philosophers — II-4-11</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#131a24; --muted:#586475; --line:#dbe1e9;
  --accent:#2b3f8c; --accent-ink:#ffffff; --accent-soft:#e6eaf7;
  --think:#4a86f0; --hungry:#e8960c; --eat:#1fa866; --bad:#d83a3a;
  --table:#ece2cc; --table-edge:#d3c196; --table-in:#e3d6b8; --plate:#ffffff; --plate-edge:#cdd5df; --plate-in:#f4f6f9; --fork:#8a95a3; --food:#d9822b;
  --font:system-ui,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1120px;margin:0 auto}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top: brand + step tabs */
header{padding-block:18px 8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0 0;padding:0;list-style:none;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button.done{color:var(--ink)}
.tabs i{font-style:normal;font-variant-numeric:tabular-nums;margin-right:6px;opacity:.75}

/* screen */
.screen{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:32px;align-items:start;padding-block:22px 12px}
@media (max-width:520px){nav.bottom .btn{padding:9px 12px}nav.bottom .where{font-size:12px}}
@media (max-width:860px){.screen{grid-template-columns:minmax(0,1fr);gap:16px}}
.copy h1{margin:0 0 12px;font-size:clamp(26px,4vw,36px);line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.copy p{margin:0 0 14px;max-width:62ch}
.copy .lead{font-size:18px;color:var(--ink)}
.copy h2{margin:22px 0 6px;font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;min-width:0}
.stage svg{display:block;width:100%;max-width:470px;margin:0 auto;height:auto}
.banner{min-height:26px;text-align:center;font-weight:700;margin:2px 0 0}
.banner.bad{color:var(--bad)}

/* table drawing */
.t-table{fill:var(--table);stroke:var(--table-edge);stroke-width:3}
.t-inner{fill:var(--table-in);opacity:.7}
.t-plate{fill:var(--plate);stroke:var(--plate-edge);stroke-width:2}
.t-plate2{fill:var(--plate-in)}
.food circle{fill:var(--food)}
.food{transition:opacity .3s ease}
.fork{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.fork path{fill:none;stroke-linecap:round;transition:stroke .3s ease}
.phil{cursor:default}
.phil.click{cursor:pointer}
.phil .body{stroke:var(--ink);stroke-width:2.5;transition:fill .3s ease,stroke .3s ease}
.phil text{fill:#fff;font-weight:800;font-family:var(--font);text-anchor:middle;pointer-events:none}
.ring{fill:none;stroke-width:3;opacity:0;transition:opacity .3s ease;transform-box:fill-box;transform-origin:center}
.ring.eat{opacity:.45}
.ring.hun{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.32)}}
.bubble{transition:opacity .3s ease;opacity:0}
.bubble circle{fill:var(--accent-soft)}
.bubble text{fill:var(--accent);font-weight:800;font-size:13px}
.arrows path{fill:none;stroke:var(--bad);stroke-width:3.4;stroke-dasharray:8 6}
.arrows,.cw{transition:opacity .4s ease;opacity:0}
.cw text{text-anchor:middle;font-family:var(--font)}
@media (prefers-reduced-motion:reduce){.fork,.food,.phil .body,.ring,.bubble,.arrows,.cw{transition:none}.ring.hun{animation:none;opacity:.4}}

/* legend + chips */
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none}
.facts li{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 12px;font-size:14px;font-weight:600}

/* state flow (screen 2) */
.flow{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.flow li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start}
.flow i{width:14px;height:14px;border-radius:50%;margin-top:6px}
.flow b{font-weight:700}
.rule{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.rule b{display:block;margin-bottom:2px}
.msg{min-height:48px;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:15px}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}

/* deadlock steps */
.steptext{min-height:96px;border-left:4px solid var(--accent);padding:6px 0 6px 14px;margin:0 0 14px;font-size:17px}
.conds{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.conds li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.conds li.hit{border-color:var(--bad)}
.conds li b{min-width:0}
.conds em{font-style:normal;color:var(--muted);font-size:13px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.fld select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
code,.mono{font-family:var(--mono);font-size:.9em}
pre.code{margin:0 0 14px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;font:13.5px/1.6 var(--mono);color:var(--ink)}

/* sim side panel */
.panel{display:grid;gap:10px;margin-top:12px}
.meals{display:grid;gap:5px}
.meals .r{display:grid;grid-template-columns:28px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.meals .r b{font-weight:700}
.meals .bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.meals .bar span{display:block;height:100%;background:var(--eat);border-radius:5px;transition:width .3s ease;width:0}
.meals .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.log{font:12.5px/1.65 var(--mono);background:#101923;color:#d2e2f0;border-radius:10px;padding:9px 12px;height:128px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:18px}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.bottom .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
nav.bottom .where{flex:1;text-align:center;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.screen.wide{display:block}
.screen.wide #real{min-width:0}
/* ---------- Бодит туршилтын дэлгэц (өмнөх UI-ийн хэв, #real дотор тусгаарласан) ---------- */
  #real .rgrid { display:grid; grid-template-columns: 290px minmax(380px, 1fr) 330px; gap:14px; padding:6px 0 8px; align-items:start; }
  @media (max-width: 1050px) { #real .rgrid { grid-template-columns: 1fr; } }
  #real .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  #real .card h2 { margin:0 0 8px; font-size:13px; font-weight:700; color:var(--muted); }
  #real label { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  #real input, #real select { width:100%; padding:6px 8px; font-size:14px; border:1px solid var(--line); border-radius:5px; }
  #real input:disabled, #real select:disabled { background:#eef1f4; }
  #real .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #real .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  #real button { padding:7px 12px; font-size:14px; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; transition:background .15s ease, border-color .15s ease; }
  #real button:hover:not(:disabled) { background:var(--accent-soft); }
  #real button:disabled { opacity:.45; cursor:not-allowed; }
  #real button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #real button.primary:hover:not(:disabled) { background:#1b2c54; }
  #real button.danger { color:var(--bad); }
  #real .presets button { font-size:12px; padding:4px 8px; }
  #real #errors { color:var(--bad); font-size:13px; margin:8px 0 0; padding-left:18px; }
  #real #errors:empty { display:none; }

  /* ---------- Төв диаграм: гол focal point ---------- */
  #real #stage { text-align:center; }
  #real #stage h2 { text-align:left; }
  #real #stage .sub { text-align:left; font-size:13px; color:var(--muted); margin:-4px 0 10px; }
  #real svg { width:100%; max-width:540px; height:auto; display:block; margin:4px auto 0; }
  #real svg circle { transition: cx .32s ease, cy .32s ease, fill .28s ease, stroke .28s ease, stroke-width .28s ease; }
  /* fork-ийн line нь x1/y1/x2/y2-ээ ТОГТМОЛ (local координат) барина; зөвхөн
   * эзэмшлийн өнгө/зузаан нь шилждэг тул л эндээс transition хэрэгтэй.
   * Байрлал/эргэлтийг доорх .forkg дээрх transform (CSS-ээр найдвартай
   * animate хийгддэг цорын ганц SVG геометрийн шинж чанар) даана —
   * x1/y1/x2/y2 дээр шууд transition тавихад зарим хөтөч дээр ажилладаггүй
   * (instant "үсрэлт") болохыг бодит хэмжилтээр баталгаажуулсан. */
  #real svg line { transition: stroke .28s ease, stroke-width .28s ease; }
  #real svg .forkg { transition: transform .32s ease; }
  #real svg text { transition: x .32s ease, y .32s ease; }
  #real #banner { text-align:center; min-height:26px; font-weight:700; margin-top:8px; transition:color .2s ease; }
  #real #banner.bad { color:var(--bad); } #real #banner.ok { color:#1b7f46; }
  #real #replay { display:flex; gap:6px; align-items:center; margin-top:10px; }
  #real #replay input[type=range] { flex:1; padding:0; }
  #real #tinfo { font-size:12px; color:var(--muted); min-width:92px; text-align:right; font-variant-numeric: tabular-nums; }
  #real .klegend { display:grid; gap:6px; font-size:13px; }
  #real .klegend i { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:6px; }
  #real .klegend .fk { display:inline-block; width:16px; height:0; border-top:4px solid; vertical-align:middle; margin-right:6px; }
  #real #status { font-size:13px; margin-top:8px; color:var(--muted); }
  #real table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  #real th, #real td { padding:3px 4px; border-bottom:1px solid var(--line); text-align:right; }
  #real th:first-child, #real td:first-child { text-align:left; }
  #real #log { height:190px; overflow:auto; font:12px/1.5 ui-monospace, Consolas, monospace; background:#101820; color:#cfe3f1;
         padding:8px; border-radius:6px; margin:0; white-space:pre-wrap; word-break:break-word; }
  @media (prefers-reduced-motion: reduce) {
    #real svg circle, #real svg line, #real svg .forkg, #real svg text, #real #banner, #real #livepulse .dot { transition:none !important; }
  }

  #real { --thinking:#4f8cff; --hungry:#ff9f1a; --eating:#2ecc71; --free:#8a949e; --card:#fff; }
  #real .rintro { margin:0 0 14px; max-width:80ch; color:var(--muted); font-size:15px; }
  #real .rhead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  #real #livepulse { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted);
               border:1px solid var(--line); border-radius:999px; padding:4px 12px; white-space:nowrap; }
  #real #livepulse b { color:var(--ink); }
  #real #livepulse .dot { width:9px; height:9px; border-radius:50%; background:var(--free); transition:background .3s ease; }
  #real #livepulse.running .dot { background:var(--eating); box-shadow:0 0 0 3px rgba(46,204,113,.25); }
  #real .card { box-shadow:none; }
  #real button { font-family:inherit; }
  #real button:not(.primary):not(.danger) { color:var(--ink); }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Dining Philosophers</b><span>F.CSM302 · БД1 · баг II-4-11 · Operating System Concepts, 7-р бүлэг</span></div>
    <ol class="tabs" id="tabs"></ol>
  </header>
  <main id="screen" class="screen" aria-live="polite"></main>
</div>
<nav class="bottom"><div class="in">
  <button class="btn" id="navback">← Буцах</button>
  <span class="where" id="navwhere"></span>
  <button class="btn p" id="navnext">Дараагийн →</button>
</div></nav>

<template id="tpl-real">
<div id="real">
<p class="rintro"><b>Жинхэнэ программ.</b> Энд C/pthread программ (<code>build/dp</code>) ажиллаж, төлөв бүрийг JSON event болгон ширээнд урсгана. <b>monitor</b>-ыг сонговол deadlock үүсэхгүй, <b>naive</b>-ыг (&ldquo;Deadlock demo&rdquo; товч) сонговол өмнөх хэсэгт үзсэн deadlock бодитоор үүснэ.</p>
<div class="rgrid">
  <!-- ЗҮҮН: тохиргоо -->
  <section class="card" id="panel">
    <h2>Тохиргоо</h2>
    <div class="presets">
      <button type="button" data-preset="book">Сурах бичиг</button>
      <button type="button" data-preset="fast">Хурдан demo</button>
      <button type="button" data-preset="many">12 philosopher</button>
      <button type="button" data-preset="deadlock">Deadlock demo</button>
    </div>
    <label for="algo">Алгоритм</label>
    <select id="algo">
      <option value="monitor">monitor (deadlock-гүй)</option>
      <option value="naive">naive (зүүн → баруун fork)</option>
    </select>
    <label for="n">Philosopher-ийн тоо (2..64)</label>
    <input id="n" type="number" value="5" min="2" max="64">
    <div class="row2">
      <div><label for="tmin">Бодох min (мс)</label><input id="tmin" type="number" value="1000" min="0"></div>
      <div><label for="tmax">Бодох max (мс)</label><input id="tmax" type="number" value="3000" min="0"></div>
      <div><label for="emin">Идэх min (мс)</label><input id="emin" type="number" value="1000" min="0"></div>
      <div><label for="emax">Идэх max (мс)</label><input id="emax" type="number" value="3000" min="0"></div>
      <div><label for="dur">Хугацаа (мс)</label><input id="dur" type="number" value="20000" min="100"></div>
      <div><label for="seed">Seed</label><input id="seed" type="number" value="1" min="0"></div>
    </div>
    <label for="grab">Fork авах завсар, зөвхөн naive (мс)</label>
    <input id="grab" type="number" value="100" min="0">
    <div class="btns">
      <button id="start" class="primary" type="button">▶ Эхлүүлэх</button>
      <button id="stop" class="danger" type="button" disabled>■ Зогсоох</button>
      <button id="reset" type="button">↺ Reset</button>
    </div>
    <ul id="errors" aria-live="polite"></ul>
  </section>

  <!-- ТӨВ: state diagram (гол focal point) -->
  <section class="card" id="stage">
    <h2 class="rhead"><span>Ширээ — philosopher ба fork-ийн төлөв (real-time)</span><span id="livepulse"><span class="dot"></span><b id="pulsetxt">Зогссон</b></span></h2>
    <div class="sub">Өнгө: <b style="color:var(--thinking)">бодож байна</b> → <b style="color:var(--hungry)">fork хүлээж байна</b> → <b style="color:var(--eating)">идэж байна</b></div>
    <svg id="table" viewBox="0 0 460 460" role="img" aria-label="Philosopher болон fork-ийн төлөв"></svg>
    <div id="banner"></div>
    <div id="replay">
      <button id="prev" type="button" title="Өмнөх event" disabled>◀</button>
      <input id="slider" type="range" min="0" max="0" value="0" disabled>
      <button id="next" type="button" title="Дараагийн event" disabled>▶</button>
      <button id="live" type="button" disabled>Live</button>
      <span id="tinfo">t = 0 мс</span>
    </div>
  </section>

  <!-- БАРУУН: legend, статистик, лог -->
  <section>
    <div class="card">
      <h2>Тэмдэглэгээ (legend)</h2>
      <div class="klegend">
        <div><i style="background:var(--thinking)"></i>thinking — бодож байна</div>
        <div><i style="background:var(--hungry)"></i>hungry — fork хүлээж байна</div>
        <div><i style="background:var(--eating)"></i>eating — хоёр fork-той, идэж байна</div>
        <div><span class="fk" style="border-color:var(--free)"></span>fork чөлөөтэй (ширээн дээр)</div>
        <div><span class="fk" style="border-color:var(--eating)"></span>fork-ыг эзэмшигчийн өнгөөр, түүн рүү ойртуулж зурна</div>
        <div style="color:var(--muted)">Fork k нь P(k−1) ба Pk-ийн дунд. Pi нь fork i, (i+1)%n-ийг ашиглана.</div>
      </div>
      <div id="status">Бэлэн.</div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Статистик (ажиллагаа дууссаны дараа)</h2>
      <table id="stats"><thead><tr><th>Phil</th><th>Хоол</th><th>Дундаж хүлээлт мс</th><th>Дээд хүлээлт мс</th><th title="Ажиллагаа дуусах мөчид philosopher ХЭВЭЭР hungry байсан бол хэдий хугацаа хүлээснийг харуулна (starvation илрүүлэх)">Дуусахад hungry (мс)</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Event лог</h2>
      <pre id="log"></pre>
    </div>
  </section>
</div>
</div>
</template>

<script src="model.js"></script>
<script>
function mountReal(root) {
  'use strict';
  root.appendChild(document.getElementById('tpl-real').content.cloneNode(true));
  var M = window.DPModel;
  var $ = function (id) { return document.getElementById(id); };
  var FIELDS = ['n', 'tmin', 'tmax', 'emin', 'emax', 'dur', 'seed', 'grab'];
  var PRESETS = {
    book:     { algo: 'monitor', n: 5,  tmin: 1000, tmax: 3000, emin: 1000, emax: 3000, dur: 20000, seed: 1, grab: 100 },
    fast:     { algo: 'monitor', n: 5,  tmin: 150,  tmax: 500,  emin: 150,  emax: 500,  dur: 15000, seed: 1, grab: 100 },
    many:     { algo: 'monitor', n: 12, tmin: 200,  tmax: 700,  emin: 200,  emax: 700,  dur: 15000, seed: 7, grab: 100 },
    deadlock: { algo: 'naive',   n: 5,  tmin: 0,    tmax: 0,    emin: 300,  emax: 600,  dur: 8000,  seed: 1, grab: 300 }
  };

  var destroyed = false;
  var events = [], snaps = [], running = false, live = true, view = 0, ctrl = null, endEvent = null;
  var renderQueued = false, curN = 5;

  function readForm() {
    var p = { algo: $('algo').value };
    FIELDS.forEach(function (k) { p[k] = $(k).value; });
    return p;

    var self=this;h.sort(function(a,b){return self.since[a]-self.since[b]});
    h.forEach(function(i){var l=(i+n-1)%n,rr=R(i);
      if(s.states[l]!=='eating'&&s.states[rr]!=='eating'){s.states[i]='eating';s.owner[i]=i;s.owner[rr]=i;self.meals[i]++;self.say('P'+i+' → eating (fork '+i+', '+rr+' авсан)');self.nar('P'+i+': хоёр хөрш нь идэхгүй тул fork '+i+', '+rr+'-ийг зэрэг аваад идэж эхэллээ.')}
      else{var w=s.states[l]==='eating'?l:rr;self.nar('P'+i+' хүлээж байна: P'+w+' идэж байгаа тул нэг fork нь завгүй.')}});
  }else{
    for(var q2=0;q2<n;q2++){i=(q2+off)%n;var st=s.states[i];
      if(st==='eating'){ if(r()<.4){s.states[i]='thinking';s.owner[i]=-1;s.owner[R(i)]=-1;this.say('P'+i+' → thinking (fork-уудаа тавьсан)');this.nar('P'+i+' идэж дуусаад хоёр fork-оо тавилаа.')} }
      else if(st==='thinking'){ if(r()<.6){s.states[i]='hungry';this.say('P'+i+' → hungry');this.nar('P'+i+' өлслөө. Эхлээд зүүн fork-оо авна.')} }
      else if(s.owner[i]!==i){ if(s.owner[i]===-1){s.owner[i]=i;this.leftAt[i]=this.t;this.say('P'+i+' зүүн fork '+i+'-ийг авлаа');this.nar('P'+i+' зүүн fork '+i+'-ийг авлаа. Одоо баруун fork '+R(i)+'-ийг хүлээнэ.')} }
      else if(this.t-this.leftAt[i]>=3&&s.owner[R(i)]===-1){s.owner[R(i)]=i;s.states[i]='eating';this.meals[i]++;this.say('P'+i+' → eating (fork '+i+', '+R(i)+')');this.nar('P'+i+' баруун fork '+R(i)+'-ийг ч авлаа. Хоёр fork-той тул идэж байна.')}
      else if(s.owner[i]===i&&s.owner[R(i)]!==-1&&s.owner[R(i)]!==i)this.nar('P'+i+' зүүн fork-оо барьсан хэвээр: баруун fork '+R(i)+' P'+s.owner[R(i)]+'-ийн гарт байна.')
    }
    var dead=true;for(i=0;i<n;i++)if(s.states[i]!=='hungry'||s.owner[i]!==i)dead=false;
    if(dead){s.deadlock=true;s.arrows=true;this.say('DEADLOCK: бүгд зүүн fork-оо барьж, баруун fork-оо хүлээж байна');this.nar('DEADLOCK: хүн бүр зүүн fork-оо барьж, баруун fork-оо хүлээж байна. Хэн ч fork тавихгүй тул хэн ч урагшлахгүй.')}
  }
  var shown=this.narr.filter(function(x){return x.indexOf('хүлээж байна:')<0||true});
  this.now=s.deadlock?shown[shown.length-1]:(shown.length?shown.slice(0,2).join(' '):'Энэ алхамд өөрчлөлт болсонгүй.');
};

/* ---------- Sim panel (meals + log) ---------- */
function nowHTML(){return '<div class="msg" id="now"><b>Яг одоо:</b> <span></span></div>'}
function panelHTML(){return '<div class="panel"><div class="meals" id="meals"></div><div class="log" id="log" aria-label="Event лог"></div></div>'}
function drawPanel(root,sim){
  var m=root.querySelector('#meals'),mx=1,i;sim.meals.forEach(function(v){if(v>mx)mx=v});
  if(m.children.length!==sim.n){m.innerHTML='';for(i=0;i<sim.n;i++){var r=document.createElement('div');r.className='r';r.innerHTML='<b>P'+i+'</b><span class="bar"><span></span></span><span class="v"></span>';m.appendChild(r)}}
  for(i=0;i<sim.n;i++){var row=m.children[i];row.querySelector('.bar span').style.width=(sim.meals[i]/mx*100)+'%';row.querySelector('.v').textContent=sim.meals[i]+' удаа'}
  var lg=root.querySelector('#log');lg.innerHTML='';sim.log.slice(-6).forEach(function(x){var d=document.createElement('div');d.textContent=x;lg.appendChild(d)});
  var nw=root.querySelector('#now span');if(nw)nw.textContent=sim.now||'Эхлэхэд бүх philosopher бодож байна.';
  var b=root.querySelector('.banner');
  if(sim.s.deadlock){b.className='banner bad';b.textContent='DEADLOCK — хэн ч урагшлах боломжгүй'}else{b.className='banner';b.textContent=''}
}

  STEPS.push('P0 нь P1-ийг, P1 нь P2-ыг, … P4 нь P0-г хүлээж байна. Хэн ч fork тавихгүй тул хэн ч идэж чадахгүй. Энэ бол deadlock.');

/* ---------- Navigation ---------- */
var cur=0,cleanup=null,root=document.getElementById('screen'),tabs=document.getElementById('tabs');
SCREENS.forEach(function(s,i){var li=document.createElement('li'),b=document.createElement('button');b.type='button';b.innerHTML='<i>'+(i+1)+'</i>'+s.tab;b.onclick=function(){go(i)};li.appendChild(b);tabs.appendChild(li)});
function go(i,noHash){
  if(i<0||i>=SCREENS.length)return;
  clearTimers();if(cleanup){cleanup();cleanup=null}
  cur=i;root.innerHTML='';root.className='screen'+(SCREENS[i].wide?' wide':'');
  cleanup=SCREENS[i].mount(root)||null;
  Array.prototype.forEach.call(tabs.querySelectorAll('button'),function(b,j){
    if(j===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');b.classList.toggle('done',j<i)});
  document.getElementById('navback').disabled=i===0;
  var nx=document.getElementById('navnext');nx.textContent=i===SCREENS.length-1?'Эхнээс нь ↺':'Дараагийн →';
  document.getElementById('navwhere').textContent=(i+1)+' / '+SCREENS.length+' · '+SCREENS[i].tab;
  document.title='Dining Philosophers — '+SCREENS[i].tab;
  if(!noHash){try{history.replaceState(null,'','#'+SCREENS[i].id)}catch(e){location.hash=SCREENS[i].id}}
  window.scrollTo(0,0);
}
document.getElementById('navback').onclick=function(){go(cur-1)};
document.getElementById('navnext').onclick=function(){go(cur===SCREENS.length-1?0:cur+1)};
document.addEventListener('keydown',function(e){var tg=e.target.tagName;if(tg==='SELECT'||tg==='INPUT')return;
  if(SCREENS[cur].id==='real')return;   /* бодит туршилтын дэлгэцэд ←/→ нь replay-д ашиглагдана */
  if(e.key==='ArrowRight')go(Math.min(cur+1,SCREENS.length-1));else if(e.key==='ArrowLeft')go(cur-1)});
function fromHash(){var h=(location.hash||'').slice(1),i=SCREENS.findIndex(function(s){return s.id===h});return i<0?0:i}
window.addEventListener('hashchange',function(){var i=fromHash();if(i!==cur)go(i,true)});
go(fromHash(),true);
})();
